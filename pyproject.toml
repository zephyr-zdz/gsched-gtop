[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsched"
dynamic = ["version"]
description = "Small job queues over ssh: gsched/gtop for GPUs (+ Slurm overflow), csched/ctop for CPUs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "zephyr-zdz" }]
dependencies = []
keywords = ["gpu", "cpu", "scheduler", "slurm", "nvidia-smi", "ssh", "monitor"]
classifiers = [
    "Environment :: Console :: Curses",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/zephyr-zdz/gsched-gtop"

[project.scripts]
gsched = "gsched.core:main"
gtop = "gsched.gtop:main"
csched = "gsched.csched:main"
ctop = "gsched.gtop:main"

[tool.setuptools.dynamic]
version = { attr = "gsched.__version__" }

[tool.setuptools.package-data]
gsched = ["hosts.example.toml", "csched.example.toml"]
